<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de paletas — TOOLS</title>
<meta name="description" content="Genera paletas de 5 colores y copia sus códigos HEX en un clic.">
<link rel="stylesheet" href="style.css">
<style>
.palette-page{padding:28px 3vw}
.palette-header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}
.palette-header h1{font-family:"Archivo Black",sans-serif;font-size:clamp(28px,4vw,54px);letter-spacing:-3px;line-height:.9}
.palette-header p{color:var(--muted);font-size:12px;max-width:420px}
.palette{display:grid;grid-template-columns:repeat(5,1fr);height:48vh;min-height:300px;border:1px solid var(--border)}
.swatch{display:flex;align-items:end;padding:18px;position:relative;transition:transform .15s}
.swatch:hover{transform:scale(1.015);z-index:2}
.swatch span{font-family:Inter,sans-serif;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;mix-blend-mode:difference;color:white}
.palette-actions{display:flex;gap:8px;margin-top:12px}
.palette-btn{border:1px solid #444;background:var(--surface);color:var(--text);padding:10px 14px;font-size:9px;font-weight:800;letter-spacing:1px;cursor:pointer}
.palette-btn:hover{background:var(--text);color:#080808}
.palette-status{color:var(--muted);font-size:10px;display:flex;align-items:center}
@media(max-width:700px){.palette-page{padding:20px 14px}.palette-header{display:block}.palette-header p{margin-top:8px}.palette{height:55vh;min-height:360px;grid-template-columns:1fr;grid-template-rows:repeat(5,1fr)}.swatch{padding:12px}.swatch span{font-size:11px}.palette-actions{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="navbar">
<a class="logo" href="index.html">TOOLS</a>
<nav><a href="index.html">INICIO</a><a href="index.html#herramientas">HERRAMIENTAS</a><a href="index.html#sobre">SOBRE</a></nav>
</header>
<main class="palette-page">
<div class="palette-header"><div><div class="hero-label">003 · COLORES</div><h1>PALETA</h1></div><p>Genera una paleta aleatoria de 5 colores. Haz clic en un color para regenerarlo.</p></div>
<div class="palette" id="palette"></div>
<div class="palette-actions"><button class="palette-btn" id="generate">NUEVA PALETA ↻</button><button class="palette-btn" id="copy">COPIAR HEX ↗</button><span class="palette-status" id="status"></span></div>
</main>
<script>
const palette=document.getElementById('palette');
const status=document.getElementById('status');
let colors=[];

function hslToHex(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(255*x).toString(16).padStart(2,'0')).join('').toUpperCase();
}

function generatePalette(){
  const base=Math.floor(Math.random()*360);
  const type=Math.floor(Math.random()*5);
  let hues;
  if(type===0){
    hues=[base,base+30,base+60,base+180,base+210];
  }else if(type===1){
    hues=[base,base+15,base+35,base+55,base+75];
  }else if(type===2){
    hues=[base,base+120,base+240,base+120,base+240];
  }else if(type===3){
    hues=[base,base+180,base+150,base+30,base+210];
  }else{
    hues=[base,base,base,base,base];
  }

  const schemes=[
    [[48,88],[42,78],[36,68],[58,55],[28,38]],
    [[52,82],[46,72],[40,64],[58,54],[30,42]],
    [[48,80],[42,70],[35,60],[55,52],[25,40]]
  ];
  const scheme=schemes[Math.floor(Math.random()*schemes.length)];

  colors=hues.map((h,i)=>{
    const [l,s]=scheme[i];
    return hslToHex((h+360)%360,s,l);
  });
  render();
}

function render(){
  palette.innerHTML='';
  colors.forEach((color,i)=>{
    const swatch=document.createElement('div');
    swatch.className='swatch';
    swatch.style.background=color;
    swatch.innerHTML='<span>'+color+'</span>';
    swatch.title='Haz clic para cambiar este color';
    swatch.onclick=()=>regenerateOne(i);
    palette.appendChild(swatch);
  });
  status.textContent='';
}

function regenerateOne(index){
  const base=parseInt(colors[0].slice(1),16);
  const r=(base>>16)&255,g=(base>>8)&255,b=base&255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h=0;
  if(max!==min){
    const d=max-min;
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;if(h<0)h+=360;
  }
  const offsets=[0,30,60,180,210];
  const offset=offsets[index];
  colors[index]=hslToHex((h+offset)%360, 45+Math.random()*35, 35+Math.random()*35);
  render();
}

document.getElementById('generate').onclick=generatePalette;
document.getElementById('copy').onclick=async()=>{
  const text=colors.join(', ');
  try{
    await navigator.clipboard.writeText(text);
    status.textContent='COPIADO ✓';
  }catch{
    status.textContent='No se pudo copiar automáticamente';
  }
};

generatePalette();
</script>
</body>
</html>
